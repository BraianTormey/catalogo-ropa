<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ropa disponible</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="branding">
      <span class="logo" id="logo"></span>
      <span class="brand" id="brand"></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar prenda…" aria-label="Buscar prenda">
    </label>
    <a class="cta" id="waTop" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</header>

<div class="page">
  <div class="toolbar">
    <h1 id="pageTitle">Catálogo</h1>
    <div class="tabs" id="chips" role="group" aria-label="Categorías"></div>
    <label class="stock-btn">
      <input type="checkbox" id="onlyStock">
      <span>Solo stock</span>
    </label>
  </div>
  <main class="grid" id="grid"></main>
</div>

<footer class="foot">
  <div class="wrap" id="footer"></div>
</footer>

<dialog id="modal" aria-label="Detalle de la prenda">
  <button class="close" id="close" aria-label="Cerrar">✕</button>
  <div class="viewer">
    <div class="stage" id="stage"></div>
    <button class="nav prev" id="prev" aria-label="Foto anterior">‹</button>
    <button class="nav next" id="next" aria-label="Foto siguiente">›</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="info" id="info"></div>
</dialog>

<script src="productos.js"></script>
<script src="app.js"></script>
</body>
</html>
