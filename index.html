<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ropa disponible</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <span class="logo" id="logo"></span>
    <span class="brand" id="brand"></span>
  </div>
</header>

<div class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="Buscar prenda…" aria-label="Buscar prenda">
    <label class="avail"><input type="checkbox" id="onlyStock"> Solo con stock</label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  <main class="grid" id="grid"></main>
</div>

<footer class="foot">
  <div class="wrap" id="footer"></div>
</footer>

<dialog id="modal" aria-label="Detalle de la prenda">
  <button class="close" id="close" aria-label="Cerrar">✕</button>
  <div class="viewer">
    <div class="stage" id="stage"></div>
    <button class="nav prev" id="prev" aria-label="Foto anterior">‹</button>
    <button class="nav next" id="next" aria-label="Foto siguiente">›</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="info" id="info"></div>
</dialog>

<script src="productos.js"></script>
<script src="app.js"></script>
</body>
</html>
